<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search AfriDesk Digital</title>
<meta name="description" content="Search AfriDesk Digital for tools, guides, resources, freelancer help, payments and career information.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;line-height:1.6;color:#172033;background:#f7f9fb}header{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:10}.nav{max-width:1100px;margin:auto;padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:25px;font-weight:800;text-decoration:none;color:#172033}.logo span{color:#0b7a75}.back{color:#0b7a75;text-decoration:none;font-weight:700}.wrap{max-width:900px;margin:auto;padding:70px 24px}.hero{text-align:center;margin-bottom:35px}.hero h1{font-size:42px;line-height:1.15;margin-bottom:12px}.hero p{color:#687386;font-size:18px}.search-box{display:flex;gap:10px;background:#fff;padding:10px;border:2px solid #b9d9d5;border-radius:14px;box-shadow:0 10px 30px rgba(20,40,60,.08);margin-bottom:25px}.search-box input{flex:1;border:0;outline:0;padding:14px;font-size:17px;min-width:0}.search-box button{border:0;background:#0b7a75;color:#fff;font-weight:700;border-radius:8px;padding:0 22px;cursor:pointer}.hint{text-align:center;color:#7a8493;font-size:14px;margin-bottom:30px}.results{display:grid;gap:14px}.result{background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:20px;text-decoration:none;color:inherit;display:block;transition:.2s}.result:hover{transform:translateY(-2px);border-color:#b9d9d5;box-shadow:0 8px 22px rgba(20,40,60,.07)}.result h2{font-size:20px;margin-bottom:4px;color:#172033}.type{display:inline-block;color:#0b7a75;font-size:12px;font-weight:700;margin-bottom:7px;text-transform:uppercase}.result p{color:#687386}.empty{text-align:center;background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:35px;color:#687386}.empty strong{display:block;color:#172033;font-size:19px;margin-bottom:7px}footer{text-align:center;padding:30px 24px;color:#7a8493;font-size:14px}@media(max-width:600px){.wrap{padding:50px 18px}.hero h1{font-size:34px}.search-box{padding:7px}.search-box button{padding:0 15px}.search-box input{min-width:0}}
</style>
</head>
<body>
<header><div class="nav"><a href="index.html" class="logo">Afri<span>Desk</span> Digital</a><a href="index.html" class="back">← Home</a></div></header>
<main class="wrap">
<div class="hero"><h1>What are you looking for?</h1><p>Search AfriDesk for tools, guides, resources and practical digital knowledge.</p></div>
<form class="search-box" id="searchForm"><input id="searchInput" type="search" placeholder="Search for a problem, tool or topic..." autocomplete="off" autofocus><button type="submit">Search</button></form>
<div class="hint">You can search by the problem you have, not just the name of a page.</div>
<div class="results" id="results"></div>
</main>
<footer>© 2026 AfriDesk Digital • Tools • Guides • Resources • FAQ</footer>
<script>
const pages=[
['Invoice Generator','Tool','Create professional invoices for local and international clients.','invoice.html'],['Currency & Fee Calculator','Tool','Estimate currency conversion results after percentage and fixed transaction fees.','currency-calculator.html'],['Freelancer Fee Calculator','Tool','Calculate what you actually keep after platform and payment fees.','freelancer-fee-calculator.html'],['Freelancer Pricing & Profit Calculator','Tool','Set a project price using hours, costs, fees, desired rate and target profit margin.','freelancer-pricing-calculator.html'],['Freelance Proposal Generator','Tool','Build a professional freelance proposal with deliverables, timeline, price and terms.','proposal-generator.html'],['Tech Career Roadmap','Resource','Explore practical paths in web development, data, UI/UX, marketing, cybersecurity and AI.','tech-career-roadmap.html'],['Freelancer Starter Kit','Resource','Move from client intake to pricing, proposal, invoice and payment tracking.','freelancer-starter-kit.html'],['International Freelance Payment Checklist','Resource','Check fees, exchange rates, settlement, withdrawal, records and scam risks before getting paid.','payment-checklist.html'],['Client & Payment Record','Resource','Track expected payments, fees, conversion, withdrawal costs and net amounts received.','payment-record-template.html'],['Freelancer Client Intake Template','Resource','Collect project goals, deliverables, deadlines, budget and payment details before quoting.','client-intake-template.html'],['Freelancer Proposal Template','Resource','Use a structured proposal covering scope, deliverables, milestones, payment and next steps.','proposal-template.html'],['How to Price Freelance Work Without Undercharging','Guide','Learn how to price freelance work using time, costs, fees, profit and project value.','guide-price-freelance-work.html'],['How to Calculate Freelance Platform and Payment Fees','Guide','Understand percentage fees, fixed fees, processing charges and your real take-home.','guide-freelance-fees.html'],['How to Write a Freelance Proposal That Wins Clients','Guide','Build clearer proposals with scope, deliverables, pricing and next steps.','guide-freelance-proposals.html'],['How to Create a Professional Invoice as a Freelancer','Guide','Learn what to include in an invoice and how to make payment easier for clients.','guide-freelance-invoices.html'],['How to Receive International Freelance Payments in Africa','Guide','Understand payment methods, exchange rates, fees, settlement and withdrawal before choosing a method.','guide-international-freelance-payments.html'],['International Payment Fees Explained','Guide','Understand the costs that can reduce your international freelance payment.','guide-international-payment-fees-explained.html'],['How to Compare International Payment Methods','Guide','Compare payment methods by total cost, exchange rate, speed, settlement and withdrawal practicality.','guide-compare-international-payment-methods.html'],['How Exchange Rates Affect Your Take-Home','Guide','Understand how currency conversion and exchange rates change the money you actually receive.','guide-understand-exchange-rates.html'],['How to Calculate Your International Payment Take-Home','Guide','Calculate your final received amount after payment fees, conversion and withdrawal costs.','guide-calculate-international-take-home.html'],['International Payment Record Keeping','Guide','Build a simple system for tracking invoices, fees, exchange rates and final payments.','guide-international-payment-record-keeping.html'],['Freelance Payment Scams','Guide','Learn how to spot fake confirmations, overpayment scams, phishing and other payment risks.','guide-freelance-payment-scams.html'],['Frequently Asked Questions','FAQ','Quick answers about freelance pricing, payments, invoices, fees, exchange rates and AfriDesk tools.','faq.html'],['Resources & Templates','Resource','Browse AfriDesk checklists, templates, calculators, roadmaps and practical resources.','resources.html'],['AfriDesk Guides','Guide','Browse practical guides for freelancing, payments, technology, productivity and digital work.','guides.html'],['AfriDesk Tools','Tool','Browse the complete collection of free AfriDesk digital tools.','tools.html'],['Fintech & Payments','Guide','Explore practical information about international payments, fees, exchange rates and financial workflows.','fintech.html']
];
function render(query=''){
 const q=query.trim().toLowerCase();
 const matches=q?pages.filter(p=>(p[0]+' '+p[1]+' '+p[2]).toLowerCase().includes(q)):pages.slice(0,10);
 const el=document.getElementById('results');
 if(!matches.length){el.innerHTML='<div class="empty"><strong>No matching result yet.</strong>Try a broader search such as “payment”, “freelance”, “invoice”, “pricing” or “career”.</div>';return;}
 el.innerHTML=matches.map(p=>`<a class="result" href="${p[3]}"><span class="type">${p[1]}</span><h2>${p[0]}</h2><p>${p[2]}</p></a>`).join('');
}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render(document.getElementById('searchInput').value)});
document.getElementById('searchInput').addEventListener('input',e=>render(e.target.value));
const initial=new URLSearchParams(location.search).get('q')||'';document.getElementById('searchInput').value=initial;render(initial);
</script>
</body>
</html>
